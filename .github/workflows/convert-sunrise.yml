name: Convert sunrise video

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/convert-sunrise.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Convert QuickTime video to browser-compatible MP4
        run: |
          ffmpeg -y \
            -i 'video/70e031b9-cb46-4476-a29a-7343fff780c4.mov' \
            -c copy \
            -movflags +faststart \
            'video/sunrise.mp4'

      - name: Commit converted MP4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add video/sunrise.mp4
          git commit -m 'Convert sunrise video to universal MP4' || exit 0
          git push
