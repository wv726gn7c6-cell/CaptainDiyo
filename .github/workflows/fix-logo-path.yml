name: Fix logo path
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-logo-path.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix exact logo filename
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('images/%20%20%20%20twin-dolphins-logo.png.PNG','images/%20%20%20%20twin-dolphins-logo.PNG')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Correct logo asset path' || exit 0
          git push
